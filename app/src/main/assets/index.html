<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GökAI Offline</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0f1726;
color:white;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
flex-direction:column;
}

header{
height:52px;
display:flex;
align-items:center;
padding:0 14px;
border-bottom:1px solid #263247;
font-size:19px;
font-weight:bold;
}

#chat{
flex:1;
overflow:auto;
padding:15px;
}

.welcome{
text-align:center;
margin-top:35%;
color:#b8c4d8;
}

.bottom{
padding:10px;
border-top:1px solid #263247;
}

.inputrow{
display:flex;
align-items:center;
background:#192438;
border-radius:25px;
padding:5px 7px 5px 14px;
}

input{
flex:1;
border:0;
outline:0;
background:transparent;
color:white;
font-size:16px;
padding:10px 0;
}

button{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:white;
color:#111827;
font-size:20px;
}

</style>
</head>

<body>

<header>GökAI Offline</header>

<div id="chat">
<div class="welcome">
<h2>GökAI 👋</h2>
<p>Offline yapay zekâ hazırlanıyor.</p>
</div>
</div>

<div class="bottom">
<div class="inputrow">
<input placeholder="GökAI'ye bir şey sor...">
<button>↑</button>
</div>
</div>

</body>
</html>
